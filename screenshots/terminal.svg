<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#14181c"/>
  <text x="40" y="70" font-family="monospace" font-size="28" fill="#9ef79e">$ make help</text>
  <text x="40" y="120" font-family="monospace" font-size="24" fill="#cde8cd">Available commands:</text>
  <text x="40" y="160" font-family="monospace" font-size="22" fill="#cde8cd">make install, make update, make clean, make backup, make doctor</text>
  <text x="40" y="240" font-family="monospace" font-size="28" fill="#9ef79e">$ make doctor</text>
  <text x="40" y="290" font-family="monospace" font-size="22" fill="#cde8cd">OK git  OK curl  OK make  OK zsh  OK tmux  OK nvim</text>
  <text x="40" y="380" font-family="monospace" font-size="24" fill="#f7d794">┌─[user@host]─[~/.dotfiles]─[git:main]</text>
  <text x="40" y="420" font-family="monospace" font-size="24" fill="#f7d794">└─$</text>
</svg>
